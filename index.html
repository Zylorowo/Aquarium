
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a4678">
    <title>Aquarium – Das Spiel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>🐠 Mein Aquarium</h1>

        <p class="description">
            Fange die Fische und sammle Punkte!
            Pass auf die Müllsäcke auf und klicke nicht ins Wasser.
            Du hast 30 Sekunden Zeit.
        </p>

        <div class="game-container">
            <canvas
                id="game"
                width="800"
                height="500"
                aria-label="Aquarium-Spiel. Klicke auf Fische, um Punkte zu sammeln."
            ></canvas>
        </div>

        <div class="instructions">
            <p>🐟 Normaler Fisch: +0,5 Punkte</p>
            <p>🐡 Kugelfisch: +1 Punkt</p>
            <p>🦈 Hai: +5 Punkte</p>
            <p>🗑️ Müllsack: -10 Punkte</p>
            <p>💧 Wasser: -1 Punkt</p>
        </div>

        <button id="restart" type="button">Spiel neu starten</button>
    </main>

    <script src="game.js"></script>
</body>
</html>
